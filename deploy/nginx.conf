# /etc/nginx/sites-enabled/machina.al-ex.ai
# Static site behind Cloudflare (Full Strict) with the shared origin certificate. Same shape as the other al-ex.ai static sites.
server {
    listen 443 ssl http2;
    server_name machina.al-ex.ai;

    ssl_certificate     /etc/nginx/ssl/al-ex.ai.crt;
    ssl_certificate_key /etc/nginx/ssl/al-ex.ai.key;

    include /etc/nginx/snippets/security-headers.conf;

    root /var/www/machina;
    index index.html;

    # Tooling and sources stay in the repo, not on the site.
    location ~ ^/(scripts|test|references|deploy|node_modules)/ { return 404; }
    location ~ /\. { return 404; }
    location ~ \.md$ { return 404; }
    location = /package.json { return 404; }
    location = /server.js { return 404; }

    # Locations that add their own headers must repeat the security headers (nginx does not inherit them).
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Vendored Three.js never changes for a given version: cache it.
    location ^~ /vendor/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    # App code changes on every deploy: revalidate. The deploy hook also stamps the commit onto module URLs.
    location ~* \.(js|css)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Catalog and model files change with every model added or fixed.
    location ^~ /data/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Meshes and textures are large and rarely change.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/octet-stream;
}

server {
    listen 80;
    server_name machina.al-ex.ai;
    return 301 https://$host$request_uri;
}
