<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Machina</title>
  <meta name="description" content="Data-driven 3D models of aircraft and vehicles, built from real specs, with every part selectable.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 9l14-5-5 9-2-3z' fill='%23ff8a3d'/%3E%3C/svg%3E">
  <script>try { const q = new URLSearchParams(location.search).get('theme'); const t = q || localStorage.getItem('machina-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="stylesheet" href="./src/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <a class="skip" href="#page">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-mark"><span></span></span><span>Machina</span></a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="topbar-end">
      <button class="icon-btn" id="theme" type="button" aria-label="Toggle light and dark theme" title="Theme"></button>
    </div>
  </header>
  <main id="page" tabindex="-1"></main>
  <!-- The 3D viewer lives here and is moved into the model page when needed. -->
  <div id="viewer-park" hidden><div class="stage-host" id="stage-host"></div></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
